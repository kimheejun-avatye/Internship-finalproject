[project]
name = "meeting-room-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.121,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "python-dotenv>=1,<2", "argon2-cffi>=23.1,<26", "httpx>=0.27,<1"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.lint.per-file-ignores]
"app/models/__init__.py" = ["F401"]
"tests/conftest.py" = ["E402"]
